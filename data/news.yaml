  body: 2024 年 2 月 17, 18 日 ＠ 富士ソフト アキバプラザ 5 階 アキバホール

2023-12-31:
  title: コミックマーケット C103 に出展しました
  body: 2023 年 12 月 31 日、東京ビッグサイトで開催された [C103](https://webcatalog.circle.ms/Perma/Circle/10473585/) にて、「マイコンから作る電子工作(予定)」を頒布しました。場所は「東ヘ 27b」。

2023-12-03:
  title: 第 2 回 自作 CPU を語る会 を開催しました
  body: 2023 年 12 月 3 日、サイボウズ東京オフィスで「第 2 回 [自作 CPU を語る会](https://making-cpu.github.io/)」を開催しました。

2023-08-31:
  title: SWEST25 で発表しました
  body: 2023 年 8 月 31 日、下呂温泉水明館で開催された [SWEST25](https://swest.toppers.jp/SWEST25/) にて「FPGA を用いたプロトタイピングを容易にするフレームワーク」の発表をし、学生賞を受賞しました。

2023-06-15:
  title: IPA 未踏 IT 人材発掘・育成事業 に採択されました
  body: "[未踏 IT 人材発掘・育成事業:2023 年度採択プロジェクト概要(太田 PJ)](https://www.ipa.go.jp/jinzai/mitou/it/2023/gaiyou_tn-1.html)"

2023-06-11:
  title: 第 1 回 自作 CPU を語る会 を開催しました
  body: 2023 年 6 月 11 日、サイボウズ東京オフィスで「[自作 CPU を語る会](https://making-cpu.github.io/)」を開催しました。

2023-03-15:
  title: 応用物理学会で発表しました
  body: 2023 年 3 月 15-18 日、上智大学四谷キャンパスで開催された [第 70 回応用物理学会春季学術講演会](https://meeting.jsap.or.jp/) にて「二酸化スズの吸光特性を利用した波長センサ」の発表をしました。

2022-09-03:
  title: Maker Faire Tokyo 2022 に出展しました
  body: 2022 年 9 月 3〜4 日、東京ビッグサイトで開催された「[Maker Faire Tokyo 2022](https://makezine.jp/event/makers-mft2022/m0083/)」に、リレーコンピュータを出展しました。

2021-10-02:
  title: Maker Faire Tokyo 2021 に出展しました
  body: 2021 年 10 月 2, 3 日、オンラインで開催された「[Maker Faire Tokyo 2021](https://makezine.jp/event/makers-mft2021/m0035/)」に、リレーコンピュータを出展しました。
