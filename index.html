<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to kanaele.com</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://kanaele.com/" />
    <meta http-equiv="refresh" content="0; url=https://kanaele.com/" />
    <script>
      location.replace(
        "https://kanaele.com" + location.pathname + location.search + location.hash,
      );
    </script>
  </head>
  <body>
    <p>このサイトは <a href="https://kanaele.com/">kanaele.com</a> に移転しました。</p>
  </body>
</html>
